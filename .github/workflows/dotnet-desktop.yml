name: RMVC core release check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify README journeys
        run: python Tests/RMVC.ReadmeChecks/verify.py
      - name: Pack core library
        run: dotnet pack RMVC/RMVC.csproj --configuration Release --output artifacts/release --nologo -p:ContinuousIntegrationBuild=true
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RMVC-package
          path: artifacts/release/*.nupkg
